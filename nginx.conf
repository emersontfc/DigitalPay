server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Responde diretamente pelo IP da VPS
    server_name _;

    root /var/www/digitalpay/dist;
    index index.html index.htm;

    # Compressão Gzip para carregamento super rápido
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Cache de imagens, fontes e arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Redirecionamento essencial para SPA (evita erro 404 em /admin e /p/:slug)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
