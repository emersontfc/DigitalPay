version: '3.8'

services:
  digitalpay:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: digitalpay_app
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production

